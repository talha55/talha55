<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:320px;overflow:hidden;background:#0b0e13}
  .wrap{position:relative;width:1280px;height:320px;font-family:Inter,system-ui,sans-serif;color:#e8ecf1}
  .grid{position:absolute;inset:0;background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:40px 40px;background-position:-1px -1px;
    mask-image:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent)}
  .glow{position:absolute;right:-120px;top:-160px;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle,rgba(79,140,255,.16),transparent 62%)}
  .content{position:absolute;left:72px;top:0;height:320px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.14em;color:#6f8fc9;text-transform:uppercase;margin-bottom:18px}
  h1{margin:0;font-size:60px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .regions{margin-top:16px;font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.08em;color:#7d8899}
  p{margin:18px 0 0;font-size:22px;font-weight:400;color:#aab4c3;letter-spacing:-.005em}
  .stack{position:absolute;right:72px;bottom:44px;font-family:"JetBrains Mono",monospace;font-size:14px;color:#6b7686;letter-spacing:.02em;text-align:right;line-height:1.9}
  .stack b{color:#9aa6b8;font-weight:400}
  .rule{position:absolute;left:72px;bottom:44px;width:56px;height:2px;background:#4f8cff}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="eyebrow">Full-stack developer · agencies and international clients</div>
    <h1>Talha Muneer</h1>
    <p>Fast, SEO-first websites and web apps, shipped with clean handoffs.</p>
    <div class="regions">USA · Australia · UK · Europe</div>
  </div>
  <div class="rule"></div>
  <div class="stack">
    <b>Next.js · Node · PHP · Laravel</b><br>
    WordPress · Shopify · Webflow · Postgres
  </div>
</div>
</body>
</html>
